name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A project venv on the matrix interpreter. `uv pip install --system` would target the
      # runner's Debian-managed Python, which refuses installs and ignores the matrix version
      # entirely -- so the whole matrix would silently test one interpreter, or fail.
      - name: Create the environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Confirm the interpreter is the one under test
        run: uv run python -c "import sys; print(sys.version)"

      # The suite is hermetic: no network, no TYPESAFE_API_KEY, no provider. If a change makes
      # CI need a credential, that change is wrong -- see CONTRIBUTING.md.
      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests examples scripts

      - name: Types
        run: uv run mypy

  adapter-imports:
    # The adapters import their frameworks lazily, so an uninstalled framework must fail at
    # call time with a clear message rather than at import time. This job installs none of the
    # optional extras and proves the package still imports cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - name: Import every module with no extras installed
        run: uv run python scripts/check_bare_install.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the distribution
        run: uv build
      - name: Check the metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
