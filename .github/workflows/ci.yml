name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv pip install --system -e ".[dev]"

      # The suite is hermetic: no network, no TYPESAFE_API_KEY, no provider. If a change
      # makes CI need a credential, that change is wrong -- see CONTRIBUTING.md.
      - name: Test
        run: uv run --no-project pytest -q

      - name: Lint
        run: uv run --no-project ruff check src tests

      - name: Types
        run: uv run --no-project mypy

  adapter-imports:
    # The adapters import their frameworks lazily, so an uninstalled framework must fail at
    # call time with a clear message rather than at import time. This job proves the package
    # imports cleanly with none of the optional extras present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv pip install --system -e .
      - name: Import every module with no extras installed
        run: |
          uv run --no-project python - <<'PY'
          import importlib
          for name in [
              "jev_governor",
              "jev_governor.adapters.openai_chat",
              "jev_governor.adapters.hermes",
              "jev_governor.adapters.openclaw",
              "jev_governor.adapters.pydantic_ai",
          ]:
              importlib.import_module(name)
              print("imported", name)

          # And static validation must refuse clearly without jsonschema, not proceed.
          from jev_governor.errors import JevError
          from jev_governor.static import validate_static_arguments
          tools = [{"name": "t", "parameters": {"type": "object"}}]
          try:
              validate_static_arguments(tools, "t", {})
          except JevError as error:
              assert "jsonschema" in str(error), error
              print("static execution refuses without jsonschema:", error)
          else:
              raise SystemExit("static validation silently proceeded without jsonschema")
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Build the distribution
        run: uv build
      - name: Check metadata
        run: |
          uv pip install --system twine
          uv run --no-project twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
